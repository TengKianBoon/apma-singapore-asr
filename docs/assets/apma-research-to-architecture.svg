<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">APMA research before code: Hokkien discovery to responsible architecture</title>
  <desc id="desc">A public-safe decision trace showing how cultural and linguistic research, regional variation, provider evidence, and a delta register became product requirements, provider-neutral architecture, targeted human verification, and consented pilot learning.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f8f7f"/>
    </marker>
    <style>
      .title { font: 700 38px "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .subtitle { font: 400 20px "Segoe UI", Arial, sans-serif; fill: #5d7088; }
      .step { font: 700 19px "Segoe UI", Arial, sans-serif; fill: #102a43; }
      .body { font: 400 15.5px "Segoe UI", Arial, sans-serif; fill: #536b82; }
      .tag { font: 700 13.5px "Segoe UI", Arial, sans-serif; fill: #0b766a; letter-spacing: .6px; }
      .control { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #324a62; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f4f7fb"/>
  <rect width="1600" height="16" fill="#0f8f7f"/>

  <g transform="translate(64 50)">
    <rect width="58" height="58" rx="16" fill="#153b5c"/>
    <text x="29" y="38" text-anchor="middle" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#ffffff">A</text>
    <text x="82" y="30" class="title">Research Before Code</text>
    <text x="82" y="61" class="subtitle">How Hokkien domain discovery became responsible APMA architecture</text>
  </g>

  <g transform="translate(1234 54)">
    <rect width="298" height="46" rx="23" fill="#e5f6f3" stroke="#a7ded5"/>
    <circle cx="25" cy="23" r="7" fill="#0f8f7f"/>
    <text x="45" y="29" class="tag">PUBLIC-SAFE DECISION TRACE</text>
  </g>

  <text x="800" y="163" text-anchor="middle" font-family="Segoe UI, Arial" font-size="25" font-weight="600" fill="#183b56">
    “Hokkien” is not one uniform acoustic target—and a provider label is not proof.
  </text>
  <text x="800" y="196" text-anchor="middle" class="subtitle">
    Research created testable requirements, explicit unknowns and bounded claims before implementation.
  </text>

  <!-- Research layer -->
  <g filter="url(#shadow)">
    <rect x="60" y="238" width="330" height="190" rx="20" fill="#ffffff" stroke="#d5e0ea"/>
    <rect x="443" y="238" width="330" height="190" rx="20" fill="#ffffff" stroke="#d5e0ea"/>
    <rect x="826" y="238" width="330" height="190" rx="20" fill="#ffffff" stroke="#d5e0ea"/>
    <rect x="1209" y="238" width="330" height="190" rx="20" fill="#ffffff" stroke="#0f8f7f" stroke-width="2"/>
  </g>

  <g>
    <circle cx="101" cy="280" r="23" fill="#153b5c"/>
    <text x="101" y="287" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">1</text>
    <text x="139" y="287" class="step">HISTORY &amp; CULTURE</text>
    <text x="91" y="330" class="body">Singapore Minnan shaped by migration,</text>
    <text x="91" y="355" class="body">local use and language contact.</text>
    <rect x="91" y="382" width="228" height="27" rx="13.5" fill="#edf3f8"/>
    <text x="205" y="401" text-anchor="middle" class="tag">CITED DOMAIN SOURCES</text>
  </g>

  <g>
    <circle cx="484" cy="280" r="23" fill="#153b5c"/>
    <text x="484" y="287" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">2</text>
    <text x="522" y="287" class="step">REGIONAL MATRIX</text>
    <text x="474" y="330" class="body">Xiamen · Quanzhou · Zhangzhou</text>
    <text x="474" y="355" class="body">Taiwanese Minnan: related, not identical.</text>
    <rect x="474" y="382" width="229" height="27" rx="13.5" fill="#edf3f8"/>
    <text x="588" y="401" text-anchor="middle" class="tag">SIMILARITY ≠ GROUND TRUTH</text>
  </g>

  <g>
    <circle cx="867" cy="280" r="23" fill="#153b5c"/>
    <text x="867" y="287" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">3</text>
    <text x="905" y="287" class="step">PROVIDER RESEARCH</text>
    <text x="857" y="330" class="body">Qwen and MERaLiON capabilities,</text>
    <text x="857" y="355" class="body">versions, evidence and operating limits.</text>
    <rect x="857" y="382" width="231" height="27" rx="13.5" fill="#edf3f8"/>
    <text x="972" y="401" text-anchor="middle" class="tag">CLAIMS TRIGGER TESTS</text>
  </g>

  <g>
    <circle cx="1250" cy="280" r="23" fill="#0f8f7f"/>
    <text x="1250" y="287" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">4</text>
    <text x="1288" y="287" class="step">DELTA REGISTER</text>
    <text x="1240" y="330" class="body">Code-switching · wording · script</text>
    <text x="1240" y="355" class="body">speakers · coverage · provider drift</text>
    <rect x="1240" y="382" width="229" height="27" rx="13.5" fill="#e5f6f3"/>
    <text x="1354" y="401" text-anchor="middle" class="tag">KNOWN · UNKNOWN · TEST</text>
  </g>

  <path d="M390 333 H432" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M773 333 H815" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1156 333 H1198" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M1374 428 V458 H800 V480" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="370" y="492" width="860" height="56" rx="28" fill="#153b5c"/>
  <text x="800" y="527" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" font-weight="700" fill="#ffffff">
    CONVERT UNCERTAINTY INTO REQUIREMENTS — NOT MARKETING CLAIMS
  </text>

  <!-- Product consequence layer -->
  <g filter="url(#shadow)">
    <rect x="60" y="596" width="330" height="178" rx="20" fill="#ffffff" stroke="#d5e0ea"/>
    <rect x="443" y="596" width="330" height="178" rx="20" fill="#ffffff" stroke="#d5e0ea"/>
    <rect x="826" y="596" width="330" height="178" rx="20" fill="#e5f6f3" stroke="#0f8f7f" stroke-width="2"/>
    <rect x="1209" y="596" width="330" height="178" rx="20" fill="#ffffff" stroke="#0f8f7f" stroke-width="2"/>
  </g>

  <g>
    <circle cx="101" cy="638" r="23" fill="#153b5c"/>
    <text x="101" y="645" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">5</text>
    <text x="139" y="645" class="step">REQUIREMENTS</text>
    <text x="91" y="688" class="body">Local code-switching, raw evidence,</text>
    <text x="91" y="713" class="body">unclear states and evaluation gates.</text>
    <text x="91" y="748" class="tag">RESEARCH → ACCEPTANCE CRITERIA</text>
  </g>

  <g>
    <circle cx="484" cy="638" r="23" fill="#153b5c"/>
    <text x="484" y="645" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">6</text>
    <text x="522" y="645" class="step">ARCHITECTURE</text>
    <text x="474" y="688" class="body">Provider-neutral routes, provenance,</text>
    <text x="474" y="713" class="body">dry-run defaults and cost controls.</text>
    <text x="474" y="748" class="tag">NO SILENT MODEL WINNER</text>
  </g>

  <g>
    <circle cx="867" cy="638" r="23" fill="#0f8f7f"/>
    <text x="867" y="645" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">7</text>
    <text x="905" y="645" class="step">HUMAN VERIFICATION</text>
    <text x="857" y="688" class="body">People review selected exact clips</text>
    <text x="857" y="713" class="body">and decide words and speakers separately.</text>
    <text x="857" y="748" class="tag">BOUNDED HUMAN AUTHORITY</text>
  </g>

  <g>
    <circle cx="1250" cy="638" r="23" fill="#0f8f7f"/>
    <text x="1250" y="645" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#ffffff">8</text>
    <text x="1288" y="645" class="step">PILOT LEARNING</text>
    <text x="1240" y="688" class="body">Quality · correction effort · adoption</text>
    <text x="1240" y="713" class="body">cost · trust · keep/change/stop decision</text>
    <text x="1240" y="748" class="tag">CONSENTED EVIDENCE</text>
  </g>

  <path d="M390 685 H432" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M773 685 H815" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1156 685 H1198" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 548 V574 H225 V585" fill="none" stroke="#0f8f7f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="836" width="1480" height="43" rx="21.5" fill="#eaf0f6"/>
  <text x="800" y="863" text-anchor="middle" class="control">
    CITED SOURCES  ·  CONTEXT-GROUNDED ANALYSIS  ·  NO MODEL-WEIGHT FINE-TUNE CLAIM  ·  BOUNDED EVIDENCE  ·  PRIVATE AUDIO EXCLUDED
  </text>
</svg>
